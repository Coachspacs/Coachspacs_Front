name: CoachSpace Frontend CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  validate:
    name: Type-Check & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run TypeScript Verification
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        run: npx vitest run

      - name: Run Production Build Validation
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://coachspace-back.onrender.com/api"
